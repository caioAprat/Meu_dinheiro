<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Meu dinheiro</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f5f2ea" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Meu dinheiro" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="robots" content="noindex,nofollow" />
    <script>
      // No iPhone, "Adicionar à Tela de Início" usaria o start_url do manifesto e perderia o #k=... do link.
      // Sem manifesto, o ícone guarda o endereço completo. No Android o manifesto continua.
      if (!/iPhone|iPad|iPod/.test(navigator.userAgent))
        document.write('<link rel="manifest" href="manifest.webmanifest">');
    </script>
    <link rel="apple-touch-icon" sizes="180x180" href="icons/cunhada-180.png" />
    <link rel="icon" href="icons/cunhada-192.png" />
    <link
      rel="preload"
      href="fonts/inter-tight-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="pagamento.css" />
    <script src="pagamento.js"></script>
  </head>
  <body>
    <a class="pular" href="#app">Ir para o painel</a>
    <header>
      <h1>Meu dinheiro</h1>
      <button class="btn" id="atualizar" aria-label="Atualizar dados do banco">
        <span id="giro" aria-hidden="true"
          ><svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M20 7v5h-5" />
            <path d="M20 12a8 8 0 1 0-2.3 5.7M20 7v5" /></svg
        ></span>
      </button>
    </header>
    <main id="app" tabindex="-1"><div class="skel"></div></main>
    <section
      id="banco-status"
      class="card"
      hidden
      tabindex="-1"
      aria-labelledby="banco-titulo"
    >
      <div class="ferramentas-cabecalho">
        <h2 id="banco-titulo">Dados do banco</h2>
        <button data-acao="fechar-banco">Fechar</button>
      </div>
      <div class="hojeTxt" id="hojeTxt"></div>
      <div class="frescor" id="frescor"></div>
      <div id="banco-conexoes"></div>
    </section>
    <div id="toast" role="status" aria-live="polite"></div>
    <footer hidden>
      Nubank e BB via Open Finance · o banco atualiza 1x por dia<br />Dinheiro
      vivo: mande “gastei 30” no Telegram
    </footer>

    <script>
      "use strict";
      // ------------------------------------------------------------------ configuração (link com #k=...&u=...)
      const LS = {
        cfg: "dinheiro.cfg",
        dados: "dinheiro.dados",
        dica: "dinheiro.dica",
      };
      const guardar = (k, v) => {
        try {
          localStorage.setItem(k, v);
        } catch (e) {
          /* modo privado */
        }
      };
      const ler = (k) => {
        try {
          return localStorage.getItem(k);
        } catch (e) {
          return null;
        }
      };

      function configDoLink() {
        const h = new URLSearchParams(
          location.hash.slice(1).replace(/&amp;/g, "&"),
        ); // link copiado do Telegram pode vir com &amp;
        return h.get("k") && h.get("u")
          ? { k: h.get("k"), u: h.get("u") }
          : null;
      }
      let CFG = configDoLink();
      if (CFG)
        guardar(LS.cfg, JSON.stringify(CFG)); // o #k=... fica no endereço de propósito: é ele que o ícone da tela inicial reabre
      else {
        try {
          CFG = JSON.parse(ler(LS.cfg));
        } catch (e) {
          CFG = null;
        }
      }

      // ------------------------------------------------------------------ utilidades
      const R = (n) =>
        (n < -0.5 ? "−" : "") +
        "R$ " +
        Math.abs(Math.round(n || 0)).toLocaleString("pt-BR");
      const R2 = (n) =>
        "R$ " +
        Number(n || 0).toLocaleString("pt-BR", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        });
      const MES = [
        "jan",
        "fev",
        "mar",
        "abr",
        "mai",
        "jun",
        "jul",
        "ago",
        "set",
        "out",
        "nov",
        "dez",
      ];
      const MESC = MES;
      const SEM = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
      const dt = (d) => new Date(d + "T12:00:00");
      const dm = (d) => d.slice(8, 10) + "/" + d.slice(5, 7);
      const esc = (t) =>
        String(t == null ? "" : t).replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      const hhmm = (iso) =>
        new Date(iso).toLocaleString("pt-BR", {
          day: "2-digit",
          month: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
        });
      const hojeLocal = () => {
        const d = new Date();
        return new Date(d - d.getTimezoneOffset() * 6e4)
          .toISOString()
          .slice(0, 10);
      }; // data do Brasil, não UTC
      let HOJE = hojeLocal();
      const mesAno = (d) =>
        d.slice(8, 10) +
        " " +
        MESC[Number(d.slice(5, 7)) - 1] +
        (d.slice(0, 4) !== HOJE.slice(0, 4) ? " " + d.slice(2, 4) : "");
      const diasAte = (d) => Math.round((dt(d) - dt(HOJE)) / 864e5);
      const quando = (d) => {
        const n = diasAte(d);
        return n === 0
          ? "hoje"
          : n === 1
            ? "amanhã"
            : n === -1
              ? "ontem"
              : n > 1 && n < 7
                ? SEM[dt(d).getDay()] + ", " + dm(d)
                : dm(d);
      };
      const $ = (id) => document.getElementById(id);

      // ------------------------------------------------------------------ estado e rede
      const S = {
        D: null,
        quando: null,
        offline: false,
        carregando: false,
        aviso: "",
        avisoRuim: false,
        erro: "",
        expandir: {},
        gen: 0,
        plano: null,
        gastoPlano: null,
        planoSeq: 0,
        sim: { valor: "", ate: "", res: null, calculando: false },
      };

      // avisos rápidos: fixos embaixo, anunciados pelo leitor de tela e somem sozinhos
      let toastTimer = null;
      function avisar(texto, ruim) {
        S.aviso = texto || "";
        S.avisoRuim = !!ruim;
        const el = $("toast");
        if (!el) return;
        el.innerHTML = S.aviso
          ? `<div class="toast ${ruim ? "ruim" : ""}">${esc(S.aviso)}</div>`
          : "";
        clearTimeout(toastTimer);
        if (S.aviso)
          toastTimer = setTimeout(() => avisar(""), ruim ? 7000 : 4000);
      }

      async function api(acao, params = {}) {
        const q = new URLSearchParams(
          Object.assign({ k: CFG.k, acao }, params),
        );
        const r = await fetch(CFG.u + "?" + q.toString(), {
          redirect: "follow",
          cache: "no-store",
        });
        const txt = await r.text();
        try {
          return JSON.parse(txt);
        } catch (e) {
          throw new Error("resposta inesperada");
        }
      }
      async function enviar(tipo, extra) {
        const r = await fetch(CFG.u + "?k=" + encodeURIComponent(CFG.k), {
          method: "POST",
          redirect: "follow",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(Object.assign({ tipo }, extra || {})),
        });
        const txt = await r.text();
        try {
          return JSON.parse(txt);
        } catch (e) {
          throw new Error("resposta inesperada");
        }
      }

      async function carregar(opcoes = {}) {
        if (S.carregando && !opcoes.forcar) return;
        const g = ++S.gen; // só a carga mais recente pode mexer na tela
        S.carregando = true;
        cabecalho();
        try {
          if (opcoes.sync) {
            const r = await enviar("sync");
            if (g === S.gen) avisar(r.aviso || "", r.ok === false);
          }
          const D = await api("dados");
          if (g !== S.gen) return;
          if (D.ok === false) {
            const e = new Error(D.erro || "erro");
            e.auth = /chave|permiss/i.test(D.erro || "");
            throw e;
          }
          S.D = D;
          S.quando = Date.now();
          S.offline = false;
          S.erro = "";
          HOJE = hojeLocal();
          S.plano = null; // o plano volta a vir dos dados novos
          guardar(LS.dados, JSON.stringify({ t: S.quando, D }));
          if (S.gastoPlano !== null) recalcularPlano(S.gastoPlano, true);
          if (D.precisaAtualizar && !opcoes.sync && !opcoes.segunda) {
            S.carregando = false;
            render();
            return carregar({ sync: true, segunda: true }); // segundo plano: o banco ficou mais de 6h sem ser lido
          }
        } catch (e) {
          if (g !== S.gen) return;
          if (e.auth) S.erro = "auth";
          else {
            S.offline = true;
            if (opcoes.sync)
              avisar("Não consegui falar com o assistente", true);
          }
        }
        S.carregando = false;
        render();
      }

      // ------------------------------------------------------------------ cabeçalho
      function cabecalho() {
        const d = new Date();
        const longo = d.toLocaleDateString("pt-BR", {
          weekday: "long",
          day: "numeric",
          month: "long",
        });
        $("hojeTxt").textContent =
          longo.charAt(0).toUpperCase() + longo.slice(1);
        $("giro").className = S.carregando ? "giro" : "";
        const f = $("frescor");
        if (!S.D) {
          f.textContent = S.carregando ? "carregando…" : "";
          return;
        }
        const ref = S.D.bancoAtualizado || S.D.atualizado;
        const horas = (Date.now() - new Date(ref).getTime()) / 36e5;
        f.textContent =
          (S.D.fonte === "banco"
            ? "Dados do banco de "
            : "Saldo informado em ") +
          hhmm(ref) +
          (S.carregando ? " · atualizando…" : "");
        f.classList.toggle("velho", horas > 30);
      }

      // ------------------------------------------------------------------ telas
      function telaSemConfig() {
        return `<div class="card"><div class="titulo">Falta o link</div>
    <p>Abra este painel pelo <b>link que o assistente manda no Telegram</b> (mande <b>painel</b> para ele).</p>
    <p class="pequeno" style="margin-top:8px">Depois, no Safari: Compartilhar → Adicionar à Tela de Início.</p></div>`;
      }
      function telaAuth() {
        return `<div class="card urgente"><div class="titulo">Acesso recusado</div>
    <p>A chave deste painel não vale mais.</p>
    <p class="pequeno" style="margin-top:8px">Mande <b>painel</b> no Telegram para receber um link novo e abra de novo.</p></div>`;
      }

      function render() {
        cabecalho();
        const app = $("app");
        if (!CFG) {
          app.innerHTML = telaSemConfig();
          return;
        }
        if (S.erro === "auth") {
          app.innerHTML = telaAuth();
          return;
        }
        if (!S.D) {
          app.innerHTML = S.offline
            ? `<div class="card"><div class="titulo">Sem conexão</div><p>Não consegui falar com o assistente e ainda não há dados guardados neste aparelho.</p><button class="btnGrande" style="margin-top:12px" data-acao="tentar">Tentar de novo</button></div>`
            : '<div class="skel"></div><div class="skel" style="height:80px"></div><div class="skel" style="height:160px"></div>';
          return;
        }
        const D = S.D,
          h = [];
        const pagamentos = (
          Array.isArray(D.pagamentos) ? D.pagamentos : []
        ).filter(
          (p) =>
            p &&
            /^\d{4}-\d{2}-\d{2}$/.test(p.dia) &&
            Number.isFinite(p.entra) &&
            Number.isFinite(p.sobra),
        );
        const primeiro = pagamentos[0];
        document.body.classList.toggle("com-pagamento", !!primeiro);
        document.querySelector('meta[name="theme-color"]').content = "#f5f2ea";

        if (S.offline)
          h.push(
            `<div class="toast ruim">Sem conexão: mostrando os dados de ${hhmm(S.quando)}. <button data-acao="tentar">Tentar de novo</button></div>`,
          );
        const problemas = (D.itens || []).filter(
          (i) => i.erro || (i.status && !/^(UPDATED|UPDATING)$/.test(i.status)),
        );
        if (problemas.length)
          h.push(
            `<div class="toast erro">Problema na conexão com o banco (${esc(problemas.map((i) => i.conector || i.status).join(", "))}). Reconecte em meu.pluggy.ai.</div>`,
          );

        if (primeiro)
          h.push(
            telaPagamento(primeiro, pagamentos.slice(1), D.missoesVisuais),
          );
        else
          h.push(
            '<section class="card"><h2 class="titulo">Pagamentos ainda não disponíveis</h2><p>Atualize para buscar o planejamento por salário. Suas contas e ferramentas continuam abaixo.</p></section>',
          );
        h.push(todasContas(pagamentos, D));
        h.push(
          '<section id="ferramentas" class="ferramentas" tabindex="-1"' +
            (S.expandir.ferramentas ? "" : " hidden") +
            '><div class="ferramentas-cabecalho"><h2>Histórico e ferramentas</h2><button data-acao="fechar-ferramentas">Fechar</button></div>',
        );
        // 3. plano do salário (aparece do dia do salário até 4 dias depois)
        if (D.plano) {
          const linhas = D.plano.split("\n");
          const cab = (linhas.shift() || "")
            .replace(/<[^>]+>/g, "")
            .replace(/^[^(]*/, "");
          const seguro = (l) =>
            esc(
              l.replace(
                /<\/?(b|i)>/g,
                (m) => "\u0001" + m.slice(1, -1) + "\u0002",
              ),
            ).replace(/\u0001(\/?(b|i))\u0002/g, "<$1>");
          const corpo = linhas
            .map((l) => seguro(l.trim()))
            .join("<br>")
            .replace(/^(<br>)+/, "");
          h.push(
            `<section class="card"><h2 class="titulo">Plano do salário<small>${esc(cab)}</small></h2><div class="plano">${corpo}</div></section>`,
          );
        }

        const PD = S.plano || D.planoDividas;
        if (PD) h.push(htmlPlano(PD));
        // 6. no seu ritmo + gráfico do saldo
        const P = D.previsao,
          a = P && P.ateSalario;
        if (a)
          h.push(`<section class="card"><h2 class="titulo">No seu ritmo<small>previsão, não meta</small></h2>
    <p>Gastando como nos últimos 30 dias (<b>${R(P.ritmo30)}/dia</b>), até ${dm(a.dia)} saem mais ≈ <b>${R(a.gastoProvavel)}</b> e o saldo fica em
    <b style="color:${a.saldoComRitmo < 0 ? "var(--apagado)" : "var(--oliva)"}">${R(a.saldoComRitmo)}</b>
    <span class="pequeno">(sem gastar nada: ${R(a.saldoSemRitmo)})</span>.</p>
    <p class="pequeno" style="margin-top:6px">Últimos 7 dias: ${R(P.ritmo7)}/dia · só o dia a dia (fora contas, empréstimos, apostas e transferências).</p></section>`);
        h.push(`<section class="card"><h2 class="titulo">Seu saldo nas próximas 5 semanas<small id="menor"></small></h2>
    <div class="grafSaldo"><svg id="svgSaldo" viewBox="0 0 340 150" preserveAspectRatio="none" role="img" aria-label="Gráfico do saldo"></svg></div>
    <div class="dica" id="dicaSaldo"></div>
    <div class="legenda"><span><i></i>só as contas</span><span><i class="trac"></i>no seu ritmo</span></div></section>`);

        // 7. simulador
        h.push(`<section class="card"><h2 class="titulo">E se eu guardar…?</h2>
    <form class="sim" data-form="simular" onsubmit="return false">
      <div><label for="simValor">Guardar (R$)</label><input id="simValor" name="valor" autocomplete="off" inputmode="decimal" enterkeyhint="go" placeholder="0" value="${esc(S.sim.valor)}"></div>
      <div><label for="simAte">Pagar até</label><input id="simAte" name="ate" autocomplete="off" type="date" value="${esc(S.sim.ate)}"></div>
    </form>
    <button class="btnGrande" data-acao="simular" ${S.sim.calculando ? "disabled" : ""}>${S.sim.calculando ? "Calculando…" : "Calcular"}</button>
    <div class="res" id="simRes">${htmlSim(S.sim.res || D.simulacao)}</div>
    <p class="pequeno" style="margin-top:10px">Deixe a data vazia para usar o próximo salário. Encargos são estimativas.</p></section>`);

        // 8. gastos
        const G = D.gastos;
        const dif = G.semana - G.semanaAnterior;
        const maxDia = Math.max(1, ...D.porDia.map((x) => x.valor));
        const maxCat = Math.max(1, ...G.top.map((x) => x[1]));
        const maxFav = Math.max(
          1,
          ...(D.favorecidos || []).map((x) => x.total),
        );
        h.push(`<section class="card"><h2 class="titulo">Gastos do dia a dia<small>sem contas, empréstimos e apostas</small></h2>
    <div class="trio" style="margin-top:0">
      <div class="mini"><b>${R(G.semana)}</b><span>últimos 7 dias</span>${G.semanaAnterior ? `<em style="color:${dif > 0 ? "var(--apagado)" : "var(--oliva)"}"> ${dif > 0 ? "▲" : "▼"} ${R(Math.abs(dif))}</em>` : ""}</div>
      <div class="mini"><b>${G.desdeSalario ? R(G.desdeSalario.total) : "—"}</b><span>desde o salário${G.desdeSalario ? " de " + dm(G.desdeSalario.desde) : ""}</span></div>
      <div class="mini"><b>${R(G.mes)}</b><span>no mês</span></div></div>
    <div class="grafico" id="barras">${D.porDia.map((x, i) => `<button data-i="${i}" aria-label="${dm(x.dia)}: ${R2(x.valor)}" class="${x.dia === HOJE ? "hoje" : ""}"><i style="height:${Math.max(3, Math.round((x.valor / maxDia) * 100))}%"></i></button>`).join("")}</div>
    <div class="eixo"><span>${dm(D.porDia[0].dia)}</span><span id="dicaBarra">toque numa barra</span><span>hoje</span></div>
    <div class="sub2">Por categoria (mês)</div>
    ${G.top.map(([c, v]) => `<div class="cat"><div class="linha"><span>${esc(c)}</span><span class="v">${R(v)}</span></div><div class="barra"><i style="width:${Math.round((v / maxCat) * 100)}%"></i></div></div>`).join("") || '<div class="vazio">Sem gastos no mês.</div>'}
    ${(D.favorecidos || []).length ? `<div class="sub2">Para quem foi o Pix (30 dias)</div>${D.favorecidos.map((f) => `<div class="cat"><div class="linha"><span>${esc(f.nome)} <span class="pequeno">${f.n}x</span></span><span class="v">${R(f.total)}</span></div><div class="barra"><i style="width:${Math.round((f.total / maxFav) * 100)}%"></i></div></div>`).join("")}<p class="pequeno">Para dar nome a alguém: mande “apelido NOME = Primo” no Telegram.</p>` : ""}
  </section>`);

        // 9. apostas (só se houve movimento; o que importa é o líquido)
        const AP = D.apostas;
        if (AP && AP.d90 && AP.d90.n > 0)
          h.push(`<section class="card"><h2 class="titulo">Apostas<small>resultado líquido, fora dos gastos</small></h2>
    <div class="linha"><span>Últimos 30 dias</span><span class="v" style="color:${AP.d30.liquido < 0 ? "var(--apagado)" : "var(--oliva)"}">${R(AP.d30.liquido)}</span></div>
    <div class="linha" style="margin-top:6px"><span>Últimos 90 dias</span><span class="v" style="color:${AP.d90.liquido < 0 ? "var(--apagado)" : "var(--oliva)"}">${R(AP.d90.liquido)}</span></div>
    <p class="pequeno" style="margin-top:8px">Movimentado em 90 dias: saiu ${R(AP.d90.saidas)} e entrou ${R(AP.d90.entradas)}.</p></section>`);

        // 10. últimas compras
        const grupos = [];
        D.ultimas.forEach((m, i) => {
          const rotulo =
            m.dia === HOJE
              ? "Hoje"
              : diasAte(m.dia) === -1
                ? "Ontem"
                : SEM[dt(m.dia).getDay()] + ", " + dm(m.dia);
          const extra = i >= 8 && !S.expandir.compras ? "escondido" : "";
          if (!grupos.length || grupos[grupos.length - 1].rotulo !== rotulo)
            grupos.push({ rotulo, itens: [], extra });
          grupos[grupos.length - 1].itens.push(
            `<div class="compra ${extra}"><div>${esc(m.descricao)}<small>${esc(m.categoria)} · ${esc(m.conta)}</small></div><div class="v">${R2(m.valor)}</div></div>`,
          );
        });
        h.push(`<section class="card"><h2 class="titulo">Últimas compras</h2>${grupos.map((g) => `<div class="diaG ${g.extra}">${g.rotulo}</div>${g.itens.join("")}`).join("") || '<div class="vazio">Nada ainda.</div>'}
    ${D.ultimas.length > 8 && !S.expandir.compras ? `<button class="mais" data-expandir="compras">Ver mais</button>` : ""}</section>`);

        // 11. banco
        if ((D.itens || []).length)
          h.push(`<section class="card"><h2 class="titulo">Conexão com o banco</h2>${D.itens.map((i) => `<div class="linha pequeno" style="padding:3px 0"><span>${esc(i.conector || "Banco")} · ${esc(i.status || (i.erro ? "erro" : ""))}</span><span>${i.ultima ? "atualizado " + hhmm(i.ultima) : ""}</span></div>`).join("")}
    <p class="pequeno" style="margin-top:6px">O acesso vale até ${D.itens[0].consentimento ? new Date(D.itens[0].consentimento).toLocaleDateString("pt-BR") : "—"}.</p></section>`);

        // 12. instalar
        const standalone =
          window.navigator.standalone === true ||
          (window.matchMedia &&
            matchMedia("(display-mode: standalone)").matches);
        if (!standalone && ler(LS.dica) !== "ok")
          h.push(`<section class="card instalar"><h2 class="titulo">Deixe na tela inicial</h2>
    <p class="pequeno">No Safari: toque em <b>Compartilhar</b> (o quadrado com a seta) → <b>Adicionar à Tela de Início</b>. Vira um ícone que abre em tela cheia.</p>
    <button data-acao="dicaok">Entendi, não mostrar mais</button></section>`);

        // troca o conteúdo sem perder o campo em que ele está digitando
        const ativo = document.activeElement,
          idAtivo = ativo && ativo.id,
          cursor = ativo && ativo.selectionStart;
        h.push("</section>");
        pararCascata();
        app.innerHTML = h.join("");
        if (primeiro) animarPagamento(primeiro);
        ligarPaginas();
        document.querySelector("footer").hidden = !S.expandir.ferramentas;
        $("banco-status").hidden = !S.expandir.banco;
        $("banco-conexoes").innerHTML = (D.itens || [])
          .map(
            (i) =>
              '<p class="pequeno">' +
              esc(i.conector || "Banco") +
              " · " +
              esc(i.status || (i.erro ? "erro" : "")) +
              (i.ultima ? " · atualizado " + hhmm(i.ultima) : "") +
              "</p>",
          )
          .join("");
        if (S.expandir.marcar) $("todas-contas").classList.add("marcando");
        if (idAtivo && $(idAtivo)) {
          const el = $(idAtivo);
          el.focus({ preventScroll: true });
          try {
            if (cursor != null) el.setSelectionRange(cursor, cursor);
          } catch (e) {
            /* range não tem cursor */
          }
        }
        desenharGrafico();
      }

      // ------------------------------------------------------------------ plano de saída das dívidas
      function htmlPlano(P, erro) {
        const d = P.hojeDividas,
          total = d.cartoes + d.faculdade + d.cheque;
        const max = Math.max(3000, Math.ceil((P.ritmoMes * 1.5) / 100) * 100);
        const valor = Math.min(max, P.gastoMes);
        const linha = (ok, txt) =>
          `<div class="marco ${ok ? "ok" : "ruim"}"><span aria-hidden="true">${ok ? "✓" : "−"}</span><span>${txt}</span></div>`;
        const nomeCurto = (n) => esc(n.replace(/\s*\(.*\)/, ""));
        const L = [];
        L.push(
          `<section class="card plano-d" aria-busy="false"><h2 class="titulo">Plano para sair das dívidas<small>${R(total)} em dívidas hoje</small></h2>`,
        );
        L.push(
          P.emDiaEm
            ? `<div class="resposta ok"><span aria-hidden="true"> </span>Em dia (nada atrasado) a partir de ${mesAno(P.emDiaEm)}</div>`
            : `<div class="resposta ruim"><span aria-hidden="true"> </span>Com esse gasto, não fica em dia em 12 meses</div>`,
        );
        L.push(
          `<div class="pequeno" style="margin:-8px 0 12px">${P.livreEm ? `Cheque especial zerado também em ${mesAno(P.livreEm)}` : "O cheque especial não zera em 12 meses (ele não é conta atrasada)"}</div>`,
        );
        L.push(
          `<div class="rotulos">${d.cartoes ? `<span>Cartão vencido <b>${R(d.cartoes)}</b></span>` : ""}${d.faculdade ? `<span>Faculdade atrasada <b>${R(d.faculdade)}</b></span>` : ""}${d.cheque ? `<span>Cheque especial <b>${R(d.cheque)}</b></span>` : ""}</div>`,
        );
        L.push(`<label class="pequeno" for="gastoPlano" style="display:block;margin-top:10px">Dia a dia por mês: <b id="gastoTxt" style="color:var(--tinta)">${R(valor)}</b>${P.usandoRitmo ? ' <span class="tag mu">seu ritmo</span>' : ""}</label>
    <div class="controle">
      <button class="passo" data-passo="-100" aria-label="Menos 100 reais">−</button>
      <input id="gastoPlano" name="gastoPlano" type="range" min="0" max="${max}" step="50" value="${valor}" class="faixa" aria-valuetext="${R(valor)} por mês">
      <button class="passo" data-passo="100" aria-label="Mais 100 reais">+</button>
    </div>
    <div class="eixo"><span>R$ 0</span>${P.usandoRitmo ? "" : `<button class="tag mu" data-gasto="${P.ritmoMes}" style="min-height:28px">usar meu ritmo (${R(P.ritmoMes)})</button>`}<span>${R(max)}</span></div>`);
        if (erro)
          L.push(`<div class="erroCard" role="alert">${esc(erro)}</div>`);
        L.push('<div class="marcos" style="margin-top:12px">');
        P.cartoes.forEach((c) =>
          L.push(
            linha(
              !!c.quitadoEm,
              c.quitadoEm
                ? `${nomeCurto(c.nome)} quitado em <b>${mesAno(c.quitadoEm)}</b>`
                : `${nomeCurto(c.nome)}: não quita em 12 meses`,
            ),
          ),
        );
        if (P.faculdade) {
          const f = P.faculdade,
            ok = f.quitadoEm && f.quitadoEm <= f.prazo;
          L.push(
            linha(
              ok,
              ok
                ? `Faculdade em dia em <b>${mesAno(f.quitadoEm)}</b> (prazo ${mesAno(f.prazo)})`
                : `Faculdade: no prazo (${mesAno(f.prazo)}) faltariam <b>${R(f.faltaNoPrazo)}</b> dos ${R(P.faculdadeAtePrazo)} que vencem até lá`,
            ),
          );
        }
        L.push(
          linha(
            !!P.chequeZeradoEm,
            P.chequeZeradoEm
              ? `Cheque especial zerado em <b>${mesAno(P.chequeZeradoEm)}</b>`
              : "Cheque especial: não zera em 12 meses",
          ),
        );
        if (P.estouro)
          L.push(
            `<div class="aviso"><span aria-hidden="true"> </span>O cheque especial passa do limite em ${mesAno(P.estouro.dia)}.</div>`,
          );
        if (P.jurosCheque + P.jurosCartao > 0)
          L.push(
            `<div class="pequeno" style="margin-top:6px">Juros no caminho ≈ ${R(P.jurosCheque + P.jurosCartao)}</div>`,
          );
        L.push("</div>");

        // metas
        const m = P.metas,
          metas = [];
        if (m.emDia)
          metas.push(
            m.emDia.gastoMax !== null
              ? `<button class="usar" data-gasto="${m.emDia.gastoMax}">Em dia até ${mesAno(m.emDia.ate)}: até <b>${R(m.emDia.gastoMax)}/mês</b> no dia a dia <span>usar ›</span></button>`
              : `<div class="pequeno">Em dia até ${mesAno(m.emDia.ate)}: nem gastando zero dá. Precisa de renda extra.</div>`,
          );
        if (m.faculdade)
          metas.push(
            m.faculdade.gastoMax !== null
              ? `<button class="usar" data-gasto="${m.faculdade.gastoMax}">Faculdade em dia até ${mesAno(m.faculdade.prazo)}: até <b>${R(m.faculdade.gastoMax)}/mês</b> no dia a dia <span>usar ›</span></button>`
              : `<div class="pequeno">Faculdade até ${mesAno(m.faculdade.prazo)}: mesmo sem gastar nada faltariam <b>${R(m.faculdade.faltaSemGastar)}</b>. Precisa de renda extra.</div>`,
          );
        metas.push(
          m.livre6.gastoMax !== null
            ? `<button class="usar" data-gasto="${m.livre6.gastoMax}">Livre de tudo em 6 meses: até <b>${R(m.livre6.gastoMax)}/mês</b> <span>usar ›</span></button>`
            : `<div class="pequeno">Livre de tudo em 6 meses: só cortando gastos não dá; precisa de renda extra.</div>`,
        );
        L.push(`<div class="sub2">Metas</div>${metas.join("")}`);

        if (S.expandir.planoDetalhe) {
          if (P.pagamentos && P.pagamentos.length) {
            L.push('<div class="sub2">Próximos pagamentos do plano</div>');
            P.pagamentos
              .slice(0, 4)
              .forEach((x) =>
                L.push(
                  `<div class="linha" style="padding:3px 0"><span>${quando(x.dia)} · ${nomeCurto(x.nome)}</span><span class="v">${R(x.valor)}</span></div>`,
                ),
              );
          }
          const sr = P.serie || [];
          if (sr.length > 1) {
            const W = 340,
              H = 80,
              mx = Math.max(1, ...sr.map((x) => x.divida));
            const pts = sr
              .map(
                (x, i) =>
                  `${((i / (sr.length - 1)) * W).toFixed(1)},${(4 + (1 - x.divida / mx) * (H - 8)).toFixed(1)}`,
              )
              .join(" L");
            L.push(`<div class="sub2">Dívida total semana a semana</div>
        <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Dívida total: ${R(sr[0].divida)} hoje e ${R(sr[sr.length - 1].divida)} em 12 meses" style="width:100%;height:80px;display:block">
        <path d="M0,${H} L${pts} L${W},${H} Z" fill="var(--trilho)"/>
        <path d="M${pts}" fill="none" stroke="var(--apagado)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>
        <div class="eixo"><span>hoje ${R(sr[0].divida)}</span><span>em 12 meses ${R(sr[sr.length - 1].divida)}</span></div>`);
          }
          L.push(`<div class="sub2">Mês a mês</div><div class="tabela"><div class="tl cab"><span>Mês</span><span>Entra</span><span>Sai*</span><span>Dívida</span></div>${P.meses
            .map(
              (x) =>
                `<div class="tl"><span>${MESC[Number(x.mes.slice(5, 7)) - 1]}/${x.mes.slice(2, 4)}</span><span>${R(x.entradas)}</span><span>${R(x.compromissos + x.diaADia)}</span><span>${R(x.dividaFim)}</span></div>`,
            )
            .join("")}</div>
      <p class="pequeno">*Sai = contas, faturas e dia a dia. Ordem do plano: cartão vencido → faculdade (o que vence) → cheque especial.</p>`);
        } else
          L.push(
            '<button class="mais" data-expandir="planoDetalhe">Ver detalhes (pagamentos, gráfico, mês a mês)</button>',
          );
        L.push("</section>");
        return L.join("");
      }

      let planoTimer = null;
      function recalcularPlano(valor, silencioso) {
        S.gastoPlano = valor;
        clearTimeout(planoTimer);
        const card = document.querySelector(".plano-d");
        if (card && !silencioso) {
          card.classList.add("recalc");
          card.setAttribute("aria-busy", "true");
        }
        planoTimer = setTimeout(async () => {
          const seq = ++S.planoSeq;
          try {
            const r = await api("planodividas", { gasto: String(valor) });
            if (seq !== S.planoSeq) return; // chegou uma resposta mais nova: ignora esta
            if (r && r.ok !== false && r.metas) {
              S.plano = r;
              trocarPlano();
            } else trocarPlano("Não consegui recalcular. Tente de novo.");
          } catch (e) {
            if (seq === S.planoSeq)
              trocarPlano(
                "Não consegui recalcular. Confira a internet e tente de novo.",
              );
          }
        }, 250);
      }
      /** Troca só o card do plano (o resto da tela, o foco e a rolagem ficam onde estão). */
      function trocarPlano(erro) {
        const velho = document.querySelector(".plano-d");
        const P = S.plano || (S.D && S.D.planoDividas);
        if (!velho || !P) return render();
        const foco = document.activeElement && document.activeElement.id;
        velho.outerHTML = htmlPlano(P, erro);
        if (foco && $(foco)) $(foco).focus({ preventScroll: true });
      }

      // ------------------------------------------------------------------ simulador
      function htmlSim(s) {
        if (!s) return "";
        const L = [];
        L.push(
          `<p class="pequeno">${s.guardar ? "Guardando " + R(s.guardar) : "Sem guardar nada extra"} até ${dm(s.alvo)} · ${R(s.minDia)}/dia para viver</p>`,
        );
        if (!s.cartoes.length && !s.nubank)
          L.push(
            '<div class="bloco ok">Nenhuma fatura de cartão pendente. </div>',
          );
        s.cartoes.forEach((c) =>
          L.push(`<div class="bloco"><b> ${esc(c.nome)}</b> · ${R(c.valor)} · venceu ${dm(c.venceu)}
    <ul><li>Pagar hoje: ≈ ${R(c.valor + c.encargosHoje)} (encargos ≈ ${R(c.encargosHoje)})${s.podePagarHoje ? "  dá" : ""}</li>
    <li>Pagar em ${dm(s.alvo)}: ≈ ${R(c.valor + c.encargosAlvo)} (encargos ≈ ${R(c.encargosAlvo)}) · cada dia a mais ≈ ${R2(c.porDia)}</li></ul>
    <div class="${s.sobraAposCartoes >= 0 ? "ok" : "ruim"}" style="margin-top:6px">${s.sobraAposCartoes >= 0 ? `Em ${dm(s.alvo)}, depois de pagar, sobram ${R(s.sobraAposCartoes)} ` : `Em ${dm(s.alvo)}, mesmo assim faltam ${R(-s.sobraAposCartoes)} `}</div></div>`),
        );
        if (s.nubank) {
          const n = s.nubank;
          L.push(`<div class="bloco"><b> ${esc(n.nome)}</b> · ${R(n.valor)} · vence ${dm(n.dia)}
    <div class="${n.cabe ? "ok" : "ruim"}" style="margin-top:4px">${n.cabe ? `No vencimento sobram ${R(n.sobraNoVencimento)} ` : `No vencimento faltam ${R(n.falta)} `}</div>
    ${n.cabe ? "" : `<ul><li>Pagando em ${dm(n.pagarEm)} (salário): +${R(n.encargosSeAtrasar)} de encargos</li></ul>`}</div>`);
        }
        L.push(
          s.necessario > 0
            ? `<div class="meta"> Para pagar tudo no prazo, junte <b>${R(s.necessario)}</b> a mais até ${dm(s.dataNecessario)}.</div>`
            : `<div class="meta"> Com isso dá para pagar tudo no prazo. </div>`,
        );
        return L.join("");
      }

      async function simular() {
        S.sim.calculando = true;
        render();
        try {
          const params = {
            valor: String(S.sim.valor || "0").replace(",", "."),
          };
          if (S.sim.ate) params.ate = S.sim.ate;
          const r = await api("simular", params);
          if (r.ok === false) throw new Error(r.erro || "erro");
          S.sim.res = r;
        } catch (e) {
          avisar("Não consegui simular agora. Tente de novo.", true);
        }
        S.sim.calculando = false;
        render();
      }

      // ------------------------------------------------------------------ gráfico do saldo
      function desenharGrafico() {
        const el = $("svgSaldo");
        if (!el || !S.D) return;
        const D = S.D,
          Sr = D.serie,
          W = 340,
          H = 150,
          PT = 14,
          PB = 22;
        const base = Sr.map((x) => x.caixa),
          ritmo = Sr.map((x) =>
            x.caixaRitmo != null ? x.caixaRitmo : x.caixa,
          );
        const max = Math.max(0, ...base, ...ritmo),
          min = Math.min(0, ...base, ...ritmo);
        const amp = max - min || 1;
        const x = (i) => (i / (Sr.length - 1)) * W;
        const y = (v) => PT + ((max - v) / amp) * (H - PT - PB);
        const zero = y(0);
        const linha = (arr) =>
          "M" +
          arr.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" L");
        const area = `M0,${zero} L${base.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" L")} L${W},${zero} Z`;
        let svg = `<defs>
    <linearGradient id="gOk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--oliva)" stop-opacity=".35"/><stop offset="1" stop-color="var(--oliva)" stop-opacity="0"/></linearGradient>
    <linearGradient id="gEr" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="var(--apagado)" stop-opacity=".45"/><stop offset="1" stop-color="var(--apagado)" stop-opacity="0"/></linearGradient>
    <clipPath id="acima"><rect x="0" y="0" width="${W}" height="${zero}"/></clipPath>
    <clipPath id="abaixo"><rect x="0" y="${zero}" width="${W}" height="${Math.max(0, H - zero)}"/></clipPath></defs>
    <path d="${area}" fill="url(#gOk)" clip-path="url(#acima)"/><path d="${area}" fill="url(#gEr)" clip-path="url(#abaixo)"/>
    <line x1="0" x2="${W}" y1="${zero}" y2="${zero}" stroke="var(--linha)" stroke-dasharray="3 4"/>
    <path d="${linha(ritmo)}" fill="none" stroke="var(--apagado)" stroke-width="1.6" stroke-dasharray="4 3" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <path d="${linha(base)}" fill="none" stroke="var(--oliva)" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`;
        D.eventos
          .filter((e) => e.valor > 0)
          .forEach((e) => {
            const i = Sr.findIndex((p) => p.dia === e.dia);
            if (i >= 0)
              svg += `<line x1="${x(i)}" x2="${x(i)}" y1="${PT - 6}" y2="${H - PB}" stroke="var(--areia)" stroke-dasharray="2 3"/>`;
          });
        let iMin = 0;
        Sr.forEach((p, i) => {
          if (p.caixa < Sr[iMin].caixa) iMin = i;
        });
        svg += `<circle cx="${x(iMin)}" cy="${y(Sr[iMin].caixa)}" r="4" fill="${Sr[iMin].caixa < 0 ? "var(--apagado)" : "var(--oliva)"}"/>`;
        [0, 7, 14, 21, 28, 35]
          .filter((i) => i < Sr.length)
          .forEach((i) => {
            svg += `<text x="${Math.min(W - 18, Math.max(2, x(i) - 12))}" y="${H - 6}" fill="var(--apagado)" font-size="13">${i === 0 ? "hoje" : dm(Sr[i].dia)}</text>`;
          });
        svg += `<line id="cursor" x1="0" x2="0" y1="${PT - 6}" y2="${H - PB}" stroke="var(--tinta)" stroke-opacity=".5" visibility="hidden"/><circle id="cursorPt" r="4" fill="var(--tinta)" visibility="hidden"/>`;
        el.innerHTML = svg;
        $("menor").textContent =
          `menor: ${R(Sr[iMin].caixa)} em ${dm(Sr[iMin].dia)}`;
        const dica = $("dicaSaldo");
        dica.innerHTML =
          "<span>Toque no gráfico para ver cada dia</span><span>linhas verdes = salário</span>";
        const mostrar = (ev) => {
          const r = el.getBoundingClientRect();
          const cx = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
          const i = Math.max(
            0,
            Math.min(
              Sr.length - 1,
              Math.round((cx / r.width) * (Sr.length - 1)),
            ),
          );
          const c = $("cursor"),
            pt = $("cursorPt");
          c.setAttribute("x1", x(i));
          c.setAttribute("x2", x(i));
          c.setAttribute("visibility", "visible");
          pt.setAttribute("cx", x(i));
          pt.setAttribute("cy", y(Sr[i].caixa));
          pt.setAttribute("visibility", "visible");
          const doDia = D.eventos
            .filter((e) => e.dia === Sr[i].dia)
            .map((e) => esc(e.nome))
            .join(", ");
          dica.innerHTML =
            `<span>${quando(Sr[i].dia)}${doDia ? " · " + doDia : ""}</span><b style="color:${Sr[i].caixa < 0 ? "var(--apagado)" : "var(--tinta)"}">${R(Sr[i].caixa)}</b>` +
            `<b style="color:var(--apagado)">${R(Sr[i].caixaRitmo != null ? Sr[i].caixaRitmo : Sr[i].caixa)}</b>`;
        };
        el.addEventListener("touchstart", mostrar, { passive: true });
        el.addEventListener("touchmove", mostrar, { passive: true });
        el.addEventListener("click", mostrar);
      }

      // ------------------------------------------------------------------ toques (um ouvinte só)
      document.addEventListener("click", async (ev) => {
        const ancora = ev.target.closest('a[href^="#"]');
        if (ancora && ["#app", "#proximos", "#todas-contas"].includes(ancora.getAttribute("href"))) {
          const destino = document.querySelector(ancora.getAttribute("href"));
          if (destino) {
            ev.preventDefault();
            destino.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "instant" : "smooth" });
            if (!destino.hasAttribute("tabindex")) destino.setAttribute("tabindex", "-1");
            destino.focus({ preventScroll: true });
          }
          return;
        }
        const alvo = ev.target.closest("button, [data-acao]");
        if (!alvo) return;
        if (alvo.id === "atualizar" || alvo.dataset.acao === "atualizar") {
          avisar("");
          carregar({ sync: true });
          return;
        }
        if (alvo.dataset.acao === "marcar") {
          S.expandir.marcar = !S.expandir.marcar;
          $("todas-contas").classList.toggle("marcando", S.expandir.marcar);
          document.querySelector(".menu-ferramentas").open = false;
          const primeiroBotao = document.querySelector(".acoes-conta button");
          if (S.expandir.marcar && primeiroBotao) primeiroBotao.focus();
          return;
        }
        if (alvo.dataset.ferramenta) {
          const banco = alvo.dataset.ferramenta === "banco";
          S.expandir[banco ? "banco" : "ferramentas"] = true;
          render();
          (banco ? $("banco-status") : $("ferramentas")).focus();
          return;
        }
        if (
          alvo.dataset.acao === "fechar-banco" ||
          alvo.dataset.acao === "fechar-ferramentas"
        ) {
          S.expandir[
            alvo.dataset.acao === "fechar-banco" ? "banco" : "ferramentas"
          ] = false;
          render();
          document.querySelector(".menu-ferramentas summary").focus();
          return;
        }
        if (alvo.dataset.acao === "tentar") {
          carregar();
          return;
        }
        if (alvo.dataset.acao === "simular") {
          simular();
          return;
        }
        if (
          alvo.dataset.gasto !== undefined ||
          alvo.dataset.passo !== undefined
        ) {
          const el = $("gastoPlano");
          const g =
            alvo.dataset.gasto !== undefined
              ? Number(alvo.dataset.gasto)
              : Math.max(
                  0,
                  Math.min(
                    Number(el ? el.max : 99999),
                    Number(el ? el.value : 0) + Number(alvo.dataset.passo),
                  ),
                );
          if (el) {
            el.value = g;
            el.setAttribute("aria-valuetext", R(g) + " por mês");
          }
          if ($("gastoTxt")) $("gastoTxt").textContent = R(g);
          recalcularPlano(g);
          return;
        }
        if (alvo.dataset.acao === "dicaok") {
          guardar(LS.dica, "ok");
          render();
          return;
        }
        if (alvo.dataset.expandir) {
          S.expandir[alvo.dataset.expandir] = true;
          render();
          return;
        }
        if (alvo.closest("#barras") && alvo.dataset.i !== undefined) {
          document
            .querySelectorAll("#barras button")
            .forEach((b) => b.classList.remove("sel"));
          alvo.classList.add("sel");
          const x = S.D.porDia[Number(alvo.dataset.i)];
          $("dicaBarra").textContent = `${quando(x.dia)}: ${R2(x.valor)}`;
          return;
        }
        if (alvo.dataset.pagar) {
          if (!alvo.classList.contains("conf")) {
            // 1º toque pede confirmação
            document.querySelectorAll("[data-pagar].conf").forEach((e) => {
              e.classList.remove("conf");
              e.textContent = e.dataset.rotulo || "Paguei";
            });
            alvo.classList.add("conf");
            alvo.textContent = "Confirmar ✓";
            alvo.dataset.t = Date.now();
            setTimeout(() => {
              if (alvo.classList.contains("conf")) {
                alvo.classList.remove("conf");
                alvo.textContent = alvo.dataset.rotulo || "Paguei";
              }
            }, 4000);
            return;
          }
          if (Date.now() - Number(alvo.dataset.t || 0) < 600) return; // 2º toque rápido demais: provavelmente sem querer
          alvo.textContent = "…";
          alvo.disabled = true;
          try {
            const r = await enviar("pagar", { chave: alvo.dataset.pagar });
            avisar(r.aviso || "", r.ok === false);
          } catch (e) {
            avisar("Não consegui marcar agora. Tente de novo.", true);
          }
          carregar({ forcar: true });
        }
      });
      document.addEventListener("input", (ev) => {
        if (ev.target.id === "simValor") S.sim.valor = ev.target.value;
        if (ev.target.id === "simAte") S.sim.ate = ev.target.value;
        if (ev.target.id === "gastoPlano") {
          const v = Number(ev.target.value);
          $("gastoTxt").textContent = R(v);
          ev.target.setAttribute("aria-valuetext", R(v) + " por mês");
        }
      });
      document.addEventListener("change", (ev) => {
        if (ev.target.id === "gastoPlano")
          recalcularPlano(Number(ev.target.value));
      });
      document.addEventListener("keydown", (ev) => {
        // "Ir" no teclado do simulador calcula
        if (ev.key === "Enter" && ev.target.id === "simValor") {
          ev.preventDefault();
          ev.target.blur();
          simular();
        }
      });
      document.addEventListener("visibilitychange", () => {
        // voltou para o app: busca de novo se passou de 2 minutos
        if (
          document.visibilityState === "visible" &&
          CFG &&
          (!S.quando || Date.now() - S.quando > 120000)
        )
          carregar();
      });

      // ------------------------------------------------------------------ início
      (function iniciar() {
        cabecalho();
        try {
          const c = JSON.parse(ler(LS.dados));
          if (c && c.D) {
            S.D = c.D;
            S.quando = c.t;
            HOJE = c.D.hoje && c.D.hoje >= hojeLocal() ? c.D.hoje : hojeLocal();
          }
        } catch (e) {
          /* sem cache */
        }
        render(); // mostra o último dado guardado na hora
        if (CFG) carregar();
        if (
          "serviceWorker" in navigator &&
          location.protocol.indexOf("http") === 0
        )
          navigator.serviceWorker.register("sw.js").catch(() => {});
      })();
    </script>
  </body>
</html>
